spring.application.name=PolyglotMesh

# Backend HTTP port. Verified free on the development machine before this was set.
server.port=8080

# Expose only the health and info actuator endpoints during Week 2.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.info.env.enabled=true

info.app.name=PolyglotMesh
info.app.description=GraalVM multi-language runtime sandbox

# The Vite dev server runs on 5173; both host spellings are accepted.
polyglotmesh.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# GraalVM execution limits. The timeout is wall-clock time per request; output
# and error text are capped so one program cannot exhaust backend memory.
polyglotmesh.graalvm.enabled=true
polyglotmesh.graalvm.execution-timeout=5s
polyglotmesh.graalvm.max-output-chars=100000
polyglotmesh.graalvm.max-error-chars=20000
