spring.application.name=PolyglotMesh

# Backend HTTP port. Verified free on the development machine before this was set.
server.port=8080

# Stop accepting new requests on shutdown and let in-flight executions finish.
# The phase timeout covers one Java compile (20s) plus execution (5s); anything
# still running after that is terminated, and @PreDestroy cleanup still runs.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Expose only the health and info actuator endpoints during Week 2.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.info.env.enabled=true

info.app.name=PolyglotMesh
info.app.description=GraalVM multi-language runtime sandbox

# The Vite dev server runs on 5173; both host spellings are accepted.
polyglotmesh.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# GraalVM execution limits. The timeout is wall-clock time per request; output
# and error text are capped so one program cannot exhaust backend memory.
polyglotmesh.graalvm.enabled=true
polyglotmesh.graalvm.execution-timeout=5s
polyglotmesh.graalvm.max-output-chars=100000
polyglotmesh.graalvm.max-error-chars=20000

# Admission control. A client gets 60 valid execution requests per minute and
# at most four programs run at once; further requests wait up to two seconds and
# then receive 429. Java compilation is separately bounded, and abandoned
# temporary directories older than an hour are swept at startup.
polyglotmesh.execution.rate-limit-enabled=true
polyglotmesh.execution.rate-limit-requests=60
polyglotmesh.execution.rate-limit-window=1m
polyglotmesh.execution.max-concurrent-executions=4
polyglotmesh.execution.acquire-timeout=2s
polyglotmesh.execution.compile-timeout=20s
polyglotmesh.execution.stale-work-dir-age=1h
